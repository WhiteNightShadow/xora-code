<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title description">
  <title id="title">Xora Code 正在启动</title>
  <description id="description">Xora Code 品牌图标和应用名称。</description>
  <defs>
    <radialGradient id="background" cx="50%" cy="35%" r="80%">
      <stop offset="0" stop-color="#182b50"/>
      <stop offset=".62" stop-color="#101a32"/>
      <stop offset="1" stop-color="#080d1c"/>
    </radialGradient>
    <linearGradient id="ice" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#dbeafe"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="640" height="360" rx="20" fill="url(#background)"/>
  <g transform="translate(246 46)">
    <path d="M105 111A62 62 0 1 1 114 85" fill="none" stroke="#72d8ff" stroke-opacity=".28" stroke-width="20" stroke-linecap="round" filter="url(#glow)"/>
    <path d="M105 111A62 62 0 1 1 114 85" fill="none" stroke="url(#ice)" stroke-width="13" stroke-linecap="round"/>
    <path d="m94 93 16 16-16 16" fill="none" stroke="#f8fafc" stroke-width="10"/>
    <path d="m114 93 16 16-16 16" fill="none" stroke="#72d8ff" stroke-width="10"/>
  </g>
  <text x="320" y="256" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="34" font-weight="650" text-anchor="middle">Xora Code</text>
  <text x="320" y="290" fill="#aebbd4" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" text-anchor="middle">开源 Agent 编程工作台</text>
</svg>
