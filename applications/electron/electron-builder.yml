appId: io.github.whitenightshadow.xoracode
productName: Xora Code
executableName: xora-code
copyright: Copyright © 2026 Xora Code contributors
electronDist: ../../node_modules/electron/dist
electronVersion: 39.8.7
asar: true
asarUnpack:
  - "**/lib/backend/native/**"
  - "**/lib/backend/shell-integrations/**"
  - "**/lib/prebuilds/**"
nodeGypRebuild: false
npmRebuild: false
afterPack: ./scripts/sanitize-after-pack.js
directories:
  buildResources: resources
  output: dist
files:
  - src-gen
  - lib
  - resources
  - scripts
  - package.json
  - "!**/node_modules/**"
  # Production source maps are retained by CI/build outputs, but are not
  # needed at runtime. Keeping them out of app.asar substantially reduces the
  # amount of data the OS, code signer and Electron must inspect on cold start.
  - "!**/*.map"
extraResources:
  - from: ../../plugins
    to: app/plugins
  - from: ../../resources/sidecars/grok
    to: sidecars/grok
  - from: ../../LICENSE
    to: legal/Xora-Code-LICENSE
  - from: ../../NOTICE.md
    to: legal/Xora-Code-NOTICE.md
  - from: ../../THIRD-PARTY-NOTICES.md
    to: legal/THIRD-PARTY-NOTICES.md
  - from: generated-legal
    to: legal/dependencies
  - from: ../../resources/legal
    to: legal/upstream
  - from: ../../resources/update
    to: update
  - from: ../../build/grok/sidecar.lock.json
    to: update/sidecar.lock.json
  - from: ../../build/grok/acp-initialize-fixture.json
    to: update/acp-initialize-fixture.json
win:
  icon: resources/icon.png
  target:
    - nsis
mac:
  icon: resources/icon.png
  category: public.app-category.developer-tools
  darkModeSupport: true
  hardenedRuntime: true
  protocols:
    - name: Xora Code
      schemes:
        - xora-code
  target:
    - dmg
    - zip
linux:
  icon: resources/icon.png
  category: Development
  maintainer: Xora Code contributors <WhiteNightShadow@users.noreply.github.com>
  mimeTypes:
    - inode/directory
  target:
    - AppImage
    - deb
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  runAfterFinish: false
artifactName: ${productName}-${version}-${os}-${arch}.${ext}
