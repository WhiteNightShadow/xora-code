<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title description">
  <title id="title">Xora Code</title>
  <description id="description">A luminous night orbit opening into a code arrow.</description>
  <defs>
    <radialGradient id="sky" cx="50%" cy="44%" r="72%">
      <stop offset="0" stop-color="#172a50"/>
      <stop offset=".58" stop-color="#0f1b35"/>
      <stop offset="1" stop-color="#080d1c"/>
    </radialGradient>
    <linearGradient id="ice" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#dbeafe"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="256" height="256" rx="56" fill="url(#sky)"/>
  <path d="M178 184A78 78 0 1 1 190 151" fill="none" stroke="#72d8ff" stroke-opacity=".26" stroke-width="22" stroke-linecap="round" filter="url(#glow)"/>
  <path d="M178 184A78 78 0 1 1 190 151" fill="none" stroke="url(#ice)" stroke-width="16" stroke-linecap="round"/>
  <path d="m166 162 20 20-20 20" fill="none" stroke="#f8fafc" stroke-width="13" stroke-linecap="square" stroke-linejoin="miter"/>
  <path d="m191 162 20 20-20 20" fill="none" stroke="#72d8ff" stroke-width="13" stroke-linecap="square" stroke-linejoin="miter"/>
</svg>
