appId: io.github.whitenightshadow.xoracode
productName: Xora Code
artifactName: ${productName}-${version}-${os}-${arch}.${ext}
directories:
  output: release
  buildResources: build-resources
files:
  - dist/**
  - static/**
  - package.json
# The factory app bundle: the fallback that is always there, even after a bad update.
extraResources:
  - from: ../../dist/app-bundle
    to: app-bundle
asar: true
# node-pty ships N-API prebuilds for all six targets, so nothing is rebuilt when cross-packaging from a mac.
npmRebuild: false
asarUnpack:
  - node_modules/node-pty/**
# Chromium's built-in strings only in Chinese and English; the other locales add about 48 MB to a mac build.
electronLanguages:
  - en-US
  - zh-CN
  - zh-TW
# Flipped in the Electron binary when packaging; see docs/design/10-security.md.
electronFuses:
  # Nobody can run this binary as plain Node (or open an inspector that way). The xora engine is a utility
  # process the shell forks (apps/desktop/src/main/shell-services.ts); child_process.fork throws with this off.
  runAsNode: false
  enableCookieEncryption: true
  # Also drops NODE_EXTRA_CA_CERTS; host and engine add the system certificate store instead.
  enableNodeOptionsEnvironmentVariable: false
  # build/ui-smoke.ts turns it back on in a copy of the app: Playwright drives Electron through the inspector.
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  grantFileProtocolExtraPrivileges: false
  # Unsigned builds: flipping fuses breaks the ad-hoc signature, which Apple silicon requires.
  resetAdHocDarwinSignature: true
# Icons: build-resources/icon.svg rendered by build/make-icons.ts (macOS keeps Apple's margins; Windows and Linux
# fill the square).
mac:
  icon: build-resources/icon.icns
  category: public.app-category.developer-tools
  # Unsigned preview builds until a Developer ID certificate is available.
  identity: null
  files:
    - "!node_modules/node-pty/prebuilds/{linux,win32}-*/**"
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
win:
  icon: build-resources/icon.ico
  files:
    - "!node_modules/node-pty/prebuilds/{darwin,linux}-*/**"
    - "!**/*.pdb"
  target:
    - target: nsis
      arch: [x64, arm64]
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
# The default AppImage runtime (appimage-12.0.1) needs libfuse2, which Ubuntu 24.04 no longer installs, and its arm64
# build links the unversioned libz.so of zlib's development package: it did not start in the Ubuntu 24.04 VM. 1.0.3 is
# the static runtime 20251108.
toolsets:
  appimage: "1.0.3"
linux:
  icon: build-resources/icon-linux.png
  executableName: xora-code
  category: Development
  maintainer: Xora Code contributors <WhiteNightShadow@users.noreply.github.com>
  files:
    - "!node_modules/node-pty/prebuilds/{darwin,win32}-*/**"
  target:
    - target: AppImage
      arch: [x64, arm64]
    - target: deb
      arch: [x64, arm64]
deb:
  # electron-builder's list plus ALSA and GBM: Electron links libasound and libgbm, which server and minimal installs
  # lack (found in the Ubuntu 24.04 VM, build/vm/linux.sh). ALSA by its real name first: on Ubuntu 24.04 apt otherwise
  # satisfies the virtual libasound2 with liboss4-salsa-asound2, which lacks symbols Electron needs.
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0
    - libuuid1
    - libsecret-1-0
    - libasound2t64 | libasound2
    - libgbm1
