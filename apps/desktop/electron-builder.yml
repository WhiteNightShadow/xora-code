appId: io.github.whitenightshadow.xoracode
productName: Xora Code
artifactName: ${productName}-${version}-${os}-${arch}.${ext}
directories:
  output: release
  buildResources: build-resources
files:
  - dist/**
  - static/**
  - package.json
# The factory app bundle: the fallback that is always there, even after a bad update.
extraResources:
  - from: ../../dist/app-bundle
    to: app-bundle
asar: true
# node-pty ships N-API prebuilds for all six targets, so nothing is rebuilt when cross-packaging from a mac.
npmRebuild: false
asarUnpack:
  - node_modules/node-pty/**
# Chromium's built-in strings only in Chinese and English; the other locales add about 48 MB to a mac build.
electronLanguages:
  - en-US
  - zh-CN
  - zh-TW
# Flipped in the Electron binary when packaging; see docs/design/10-security.md.
electronFuses:
  # The xora engine runs on this binary with ELECTRON_RUN_AS_NODE=1 (packages/host/src/core.ts).
  runAsNode: true
  enableCookieEncryption: true
  # Also drops NODE_EXTRA_CA_CERTS; host and engine add the system certificate store instead.
  enableNodeOptionsEnvironmentVariable: false
  # build/ui-smoke.ts turns it back on in a copy of the app: Playwright drives Electron through the inspector.
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  grantFileProtocolExtraPrivileges: false
  # Unsigned builds: flipping fuses breaks the ad-hoc signature, which Apple silicon requires.
  resetAdHocDarwinSignature: true
mac:
  icon: build-resources/icon.png
  category: public.app-category.developer-tools
  # Unsigned preview builds until a Developer ID certificate is available.
  identity: null
  files:
    - "!node_modules/node-pty/prebuilds/{linux,win32}-*/**"
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
win:
  icon: build-resources/icon.png
  files:
    - "!node_modules/node-pty/prebuilds/{darwin,linux}-*/**"
    - "!**/*.pdb"
  target:
    - target: nsis
      arch: [x64, arm64]
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
linux:
  icon: build-resources/icon.png
  executableName: xora-code
  category: Development
  maintainer: Xora Code contributors <WhiteNightShadow@users.noreply.github.com>
  files:
    - "!node_modules/node-pty/prebuilds/{darwin,win32}-*/**"
  target:
    - target: AppImage
      arch: [x64, arm64]
    - target: deb
      arch: [x64, arm64]
